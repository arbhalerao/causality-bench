name: message_rate
description: >
  communication intensity sweep;
  the probability that a step is a send rather than a local event controls how much of the execution is causally linked
seeds:
  start: 42
  count: 30
base:
  nodes: 8
  events_per_node: 1000
  topology: complete
  delay_distribution: exponential
  mean_delay: 10.0
  mean_interarrival: 1.0
  loss_probability: 0.0
sweep:
  message_probability: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90]
