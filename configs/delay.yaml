name: delay
description: >
  network delay sweep crossing the delay law with its mean;
  all three laws share the same mean at a given point,
  so the distribution axis varies only the variance of the transport while the mean delay axis varies its magnitude
seeds:
  start: 42
  count: 30
base:
  nodes: 8
  events_per_node: 1000
  message_probability: 0.25
  topology: complete
  mean_interarrival: 1.0
  loss_probability: 0.0
sweep:
  delay_distribution: [deterministic, uniform, exponential]
  mean_delay: [1.0, 10.0, 50.0]
